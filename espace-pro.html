<style>
/* Layout: app shell — barre du haut, onglets, contenu en cartes. Mêmes jetons que le site vitrine. */
:root{
  --bg:#F5F7FF; --surface:#FFFFFF; --ink:#11163A; --muted:#58608A; --line:#DDE3F6;
  --blue:#3352FF; --sky:#84D8FF; --violet:#6A5CFF; --navy:#11163A; --on-navy:#F2F5FF; --sky-soft:#E3F5FF;
  --ok:#14915F; --ok-soft:#DDF5EA; --warn:#B76A00; --warn-soft:#FFF0D6; --bad:#C8323C; --bad-soft:#FDE3E5;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0D24; --surface:#121838; --ink:#EEF1FF; --muted:#A2AAD2; --line:#252D57;
  --blue:#5770FF; --sky:#84D8FF; --violet:#7D71FF; --navy:#060818; --sky-soft:#13284A;
  --ok:#4BD39A; --ok-soft:#10352A; --warn:#FFB54A; --warn-soft:#3A2A10; --bad:#FF7A84; --bad-soft:#3D1620; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0D24; --surface:#121838; --ink:#EEF1FF; --muted:#A2AAD2; --line:#252D57;
  --blue:#5770FF; --sky:#84D8FF; --violet:#7D71FF; --navy:#060818; --sky-soft:#13284A;
  --ok:#4BD39A; --ok-soft:#10352A; --warn:#FFB54A; --warn-soft:#3A2A10; --bad:#FF7A84; --bad-soft:#3D1620; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip}
img{max-width:100%;display:block}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:600}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}

/* Buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .95rem/1 var(--f-body);padding:12px 18px;border-radius:999px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;transition:transform .15s,background .15s,border-color .15s;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--blue)}
.btn-sm{padding:8px 13px;font-size:.85rem}
.btn[disabled]{opacity:.55;cursor:wait}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-weight:600;font-size:.88rem}
.field > label{display:flex;flex-direction:column;gap:6px}
.field > label > input,.field > label > select{font-weight:400;font-size:1rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 16%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.chips input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.chips label{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:.88rem;cursor:pointer}
.chips input:checked+label{background:var(--blue);border-color:var(--blue);color:#fff}
.chips input:focus-visible+label{outline:3px solid var(--sky);outline-offset:2px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:620px){.form-grid{grid-template-columns:1fr}}

/* Shell */
.demo-bar{background:var(--navy);color:var(--on-navy);font-size:.85rem;text-align:center;padding:8px 16px}
.demo-bar b{color:var(--sky)}
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.brand img{width:132px;height:auto;flex:none}
.brand .dk{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand .lt{display:none}:root:not([data-theme="light"]) .brand .dk{display:block}}
:root[data-theme="dark"] .brand .lt{display:none}:root[data-theme="dark"] .brand .dk{display:block}
.brand span{font-weight:600;color:var(--muted);font-size:.9rem;border-left:1px solid var(--line);padding-left:12px;white-space:nowrap}
.top-right{display:flex;align-items:center;gap:10px;min-width:0}
.who{font-weight:600;font-size:.9rem;text-align:right;line-height:1.25;min-width:0}
.who small{display:block;color:var(--muted);font-weight:500}
@media (max-width:640px){.who,.brand span{display:none}}
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;font:600 .93rem var(--f-body);color:var(--muted);padding:15px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.tab .badge{background:var(--blue);color:#fff;border-radius:999px;font-size:.72rem;padding:2px 7px}
main{padding-block:28px 64px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-h > div{display:flex;flex-direction:column;gap:6px}
.site-pick{display:flex;align-items:center;gap:10px}
.site-pick select{width:auto;min-width:200px;background:var(--surface)}

/* Cards & grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:1.6fr 1fr}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
@media (max-width:980px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2{grid-template-columns:1fr}}
@media (max-width:460px){.g-kpi{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .k-l{font-size:.85rem;color:var(--muted);font-weight:600}
.kpi .k-v{font-family:var(--f-display);font-size:clamp(1.35rem,2.4vw,1.75rem);font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:.85rem;color:var(--muted)}
.kpi.hero{background:linear-gradient(130deg,var(--blue),var(--violet));border:0;color:#fff}
.kpi.hero .k-l,.kpi.hero .k-s{color:rgba(255,255,255,.85)}
.delta{font-weight:700}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.kpi.hero .delta{color:#fff}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--sky-soft);color:var(--blue)}
.p-mute{background:var(--bg);color:var(--muted)}

/* Chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 11px var(--f-body)}
.chart .val{fill:var(--ink);font-weight:700}
.chart .grid-l{stroke:var(--line)}
.chart .bar{fill:var(--sky)}
.chart .bar.last{fill:var(--blue)}
.chart g:hover .bar{fill:var(--violet)}

/* Lists & tables */
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0;padding-top:0}
.li > div{min-width:0}
.li > span.num{white-space:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td input,td select{padding:8px 10px;border-radius:10px}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .b{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.9rem}
.bars .b i{grid-column:1/-1;height:8px;border-radius:8px;background:var(--sky-soft);overflow:hidden;display:block}
.bars .b i::after{content:"";display:block;height:100%;width:var(--w);background:var(--blue);border-radius:8px}

/* Machines */
.mcard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:start}
.mcard .ph{background:var(--sky-soft);border-radius:14px;height:150px;display:flex;align-items:flex-end;justify-content:center;padding:10px 6px 8px}
.mcard .ph img{height:100%;width:auto;object-fit:contain}
.mcard dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin:10px 0 14px;font-size:.88rem}
.mcard dt{color:var(--muted)}
.mcard dd{margin:0;font-weight:600}

/* Timeline */
.tl{display:flex;flex-direction:column}
.tl .ev{display:grid;grid-template-columns:110px 18px minmax(0,1fr);gap:12px;padding-bottom:18px;position:relative}
.tl .ev .d{font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
.tl .ev .dot{width:12px;height:12px;border-radius:50%;background:var(--blue);margin-top:5px;position:relative;z-index:1;box-shadow:0 0 0 4px var(--surface)}
.tl .ev:not(:last-child)::after{content:"";position:absolute;left:calc(110px + 12px + 5px);top:18px;bottom:0;width:2px;background:var(--line)}
@media (max-width:520px){.tl .ev{grid-template-columns:78px 18px minmax(0,1fr)}.tl .ev:not(:last-child)::after{left:calc(78px + 12px + 5px)}}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login .side{background:var(--navy);color:var(--on-navy);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.login .side .o{position:absolute;right:-120px;bottom:-140px;width:460px;color:var(--blue);opacity:.45;animation:spin 60s linear infinite}
.login .side h2{font-size:clamp(1.5rem,2.6vw,2.1rem);color:#fff;max-width:16ch}
.login .side ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;position:relative}
.login .side li{display:flex;gap:10px;color:#C8CFF0}
.login .side li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--sky);margin-top:8px}
.login .form{display:flex;align-items:center;justify-content:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.login form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.login .demo{border-top:1px solid var(--line);padding-top:18px;margin-top:6px;display:flex;flex-direction:column;gap:10px}
.err{color:var(--bad);font-weight:600;font-size:.9rem}
@media (max-width:860px){.login{grid-template-columns:1fr}.login .side{padding:28px max(16px,env(safe-area-inset-left,0px));min-height:auto}.login .side ul{display:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Modal & toast */
.modal{position:fixed;inset:0;background:rgba(6,8,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:50}
.modal .card{width:100%;max-width:720px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--navy);color:#fff;padding:13px 18px;border-radius:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 14px 34px -14px rgba(0,0,0,.5)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:16px}
.statement h3{font-size:1.4rem}
.statement .meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:14px 0 20px;font-size:.9rem}
.statement .total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:12px;margin-top:6px;font-weight:700}
.statement .total b{font-family:var(--f-display);font-size:1.3rem}
.row-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:nowrap}
details.client{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
details.client summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
details.client summary::-webkit-details-marker{display:none}
details.client[open] summary{border-bottom:1px solid var(--line)}
details.client .inner{padding:18px;display:flex;flex-direction:column;gap:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
"use strict";
var CFG=window.GOMATIK_CONFIG||{};
var LIVE=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey);
var sb=null;
var DOMAINE_CLIENTS='clients.gomatik.fr';
function loginEmail(id){id=String(id||'').trim().toLowerCase();return id.indexOf('@')>=0?id:id+'@'+DOMAINE_CLIENTS}

/* ---------- Utilitaires ---------- */
var EUR=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
var EUR0=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
function eur(v){return EUR.format(+v||0)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(sel,root){return (root||document).querySelector(sel)}
function $$(sel,root){return [].slice.call((root||document).querySelectorAll(sel))}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monthStart(d){return new Date(d.getFullYear(),d.getMonth(),1)}
function addMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,1)}
function parseD(s){var p=String(s).slice(0,10).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function moisLong(s){var t=parseD(s).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)}
function moisCourt(s){return parseD(s).toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}
function dateFr(s){return s?parseD(s).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'—'}
function dateCourt(s){return s?parseD(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'}
function uid(){return 'x'+Math.random().toString(36).slice(2,10)}
function toast(msg){$$('.toast').forEach(function(x){x.remove()});var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},3800)}

/* ---------- Couche données (démo ou Supabase) ---------- */
var demoDB=null;
var API={
  init:function(){
    if(!LIVE){demoDB=makeDemo();return Promise.resolve()}
    return new Promise(function(res,rej){
      var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
      s.onload=function(){sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);res()};
      s.onerror=function(){rej(new Error('Impossible de charger le module de connexion.'))};document.head.appendChild(s);
    });
  },
  session:function(){if(!LIVE)return Promise.resolve(null);return sb.auth.getSession().then(function(r){return r.data.session})},
  signIn:function(id,pw){return sb.auth.signInWithPassword({email:loginEmail(id),password:pw}).then(function(r){if(r.error)throw new Error('Identifiant ou mot de passe incorrect.');return r.data.session})},
  reset:function(email){return sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}).then(function(r){if(r.error)throw r.error})},
  setPassword:function(pw){if(!LIVE)return Promise.resolve();return sb.auth.updateUser({password:pw}).then(function(r){if(r.error)throw r.error;return sb.rpc('mark_password_changed')})},
  signOut:function(){return LIVE?sb.auth.signOut():Promise.resolve()},
  profile:function(user){return sb.from('profiles').select('*').eq('id',user.id).single().then(function(r){if(r.error)throw r.error;return r.data})},
  loadAll:function(){
    if(!LIVE)return Promise.resolve(JSON.parse(JSON.stringify(demoDB)));
    var since=ymd(addMonths(monthStart(new Date()),-13));
    var q=function(t,f){var x=sb.from(t).select('*');if(f)x=f(x);return x.then(function(r){if(r.error)throw r.error;return r.data})};
    return Promise.all([q('clients',function(x){return x.order('nom')}),q('sites',function(x){return x.order('nom')}),q('machines',function(x){return x.order('numero')}),
      q('releves',function(x){return S.role==='admin'?x:x.gte('mois',since)}),q('passages',function(x){return x.order('date',{ascending:false}).limit(400)}),
      q('interventions',function(x){return x.order('created_at',{ascending:false})}),q('documents',function(x){return x.order('created_at',{ascending:false})}),
      S.role==='admin'?q('depenses',function(x){return x.order('date',{ascending:false})}):Promise.resolve([]),S.role==='admin'?q('parametres'):Promise.resolve([]),S.role==='admin'?q('profiles'):Promise.resolve([])])
    .then(function(a){return{clients:a[0],sites:a[1],machines:a[2],releves:a[3],passages:a[4],interventions:a[5],documents:a[6],depenses:a[7],parametres:a[8],profiles:a[9]}});
  },
  insert:function(table,row){
    if(!LIVE){row=Object.assign({id:uid(),created_at:new Date().toISOString(),updated_at:new Date().toISOString()},row);demoDB[table].unshift(row);return Promise.resolve(row)}
    return sb.from(table).insert(row).select().single().then(function(r){if(r.error)throw r.error;return r.data});
  },
  update:function(table,id,patch){
    if(!LIVE){var x=demoDB[table].find(function(r){return r.id===id});Object.assign(x,patch,{updated_at:new Date().toISOString()});return Promise.resolve(x)}
    return sb.from(table).update(patch).eq('id',id).select().single().then(function(r){if(r.error)throw r.error;return r.data});
  },
  upsertReleves:function(rows){
    if(!LIVE){rows.forEach(function(r){var i=demoDB.releves.findIndex(function(x){return x.machine_id===r.machine_id&&x.mois===r.mois});
      var full=Object.assign({id:uid()},r,{commission:Math.round(r.ca*r.taux_commission)/100});if(i>=0)demoDB.releves[i]=full;else demoDB.releves.push(full)});return Promise.resolve()}
    return sb.from('releves').upsert(rows,{onConflict:'machine_id,mois'}).then(function(r){if(r.error)throw r.error});
  },
  access:function(body){
    if(!LIVE){
      var pw='GoDemo'+Math.random().toString(36).slice(2,6);
      if(body.action==='create'){if(demoDB.profiles.some(function(p){return p.identifiant===body.identifiant}))return Promise.reject(new Error('Cet identifiant est déjà utilisé.'));
        demoDB.profiles.push({id:uid(),role:'client',client_id:body.client_id,nom:body.nom,identifiant:body.identifiant,doit_changer_mdp:true});return Promise.resolve({identifiant:body.identifiant,mot_de_passe:pw})}
      var p=demoDB.profiles.find(function(x){return x.id===body.user_id});p.doit_changer_mdp=true;return Promise.resolve({identifiant:p.identifiant,mot_de_passe:pw});
    }
    return sb.functions.invoke('client-access',{body:body}).then(function(r){
      if(!r.error)return r.data;
      var ctx=r.error.context;return (ctx&&ctx.json?ctx.json():Promise.resolve({})).then(function(j){throw new Error((j&&j.error)||r.error.message)});
    });
  },
  upload:function(clientId,file,titre){
    if(!LIVE)return API.insert('documents',{client_id:clientId,titre:titre,chemin:clientId+'/'+file.name});
    var path=clientId+'/'+Date.now()+'-'+file.name.replace(/[^\w.\-]/g,'_');
    return sb.storage.from('documents').upload(path,file).then(function(r){if(r.error)throw r.error;return API.insert('documents',{client_id:clientId,titre:titre,chemin:path})});
  },
  remove:function(table,id){
    if(!LIVE){demoDB[table]=demoDB[table].filter(function(r){return r.id!==id});return Promise.resolve()}
    return sb.from(table).delete().eq('id',id).then(function(r){if(r.error)throw r.error});
  },
  uploadJustif:function(file){
    if(!LIVE)return Promise.resolve('demo/'+file.name);
    var path=new Date().getFullYear()+'/'+Date.now()+'-'+file.name.replace(/[^\w.\-]/g,'_');
    return sb.storage.from('justificatifs').upload(path,file).then(function(r){if(r.error)throw r.error;return path});
  },
  justifUrl:function(path){return sb.storage.from('justificatifs').createSignedUrl(path,120).then(function(r){if(r.error)throw r.error;return r.data.signedUrl})},
  setParam:function(cle,valeur){
    if(!LIVE){var p=demoDB.parametres.find(function(x){return x.cle===cle});if(p)p.valeur=valeur;else demoDB.parametres.push({cle:cle,valeur:valeur});return Promise.resolve()}
    return sb.from('parametres').upsert({cle:cle,valeur:valeur}).then(function(r){if(r.error)throw r.error});
  },
  docUrl:function(path){return sb.storage.from('documents').createSignedUrl(path,120).then(function(r){if(r.error)throw r.error;return r.data.signedUrl})}
};

/* ---------- État ---------- */
var S={role:null,clientId:null,userName:'',data:null,tab:null,site:'all',adminMonth:null,intPrefill:null};

function boot(){
  var hash=location.hash||'';
  var recovery=/type=(recovery|invite)/.test(hash);
  API.init().then(function(){
    if(!LIVE){renderLogin();return}
    sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY')renderSetPassword()});
    return API.session().then(function(sess){
      if(sess&&recovery){renderSetPassword();return}
      if(sess)return enter(sess.user);
      renderLogin();
    });
  }).catch(function(e){renderLogin(e.message)});
}

function enter(user){
  return API.profile(user).then(function(p){
    S.role=p.role;S.clientId=p.client_id;S.userName=p.nom||user.email;S.userId=user.id;
    if(S.role==='client'&&!S.clientId){renderLogin("Votre compte n'est pas encore rattaché à un client. Contactez GOMATIK.");return API.signOut()}
    if(p.doit_changer_mdp){renderSetPassword();return}
    return reload().then(function(){S.tab=S.role==='admin'?'apercu':'dashboard';render()});
  }).catch(function(e){renderLogin(e.message||'Connexion impossible.')});
}
function reload(){return API.loadAll().then(function(d){S.data=d})}

/* ---------- Graphique 12 mois ---------- */
function chart12(months){
  var last=addMonths(monthStart(new Date()),-1),cols=[];
  for(var i=11;i>=0;i--){var k=ymd(addMonths(last,-i));var m=months.find(function(x){return x.mois===k});cols.push({k:k,v:m?m.commission:0})}
  var max=Math.max.apply(null,cols.map(function(c){return c.v}))||1,step=niceStep(max),top=Math.ceil(max/step)*step;
  var W=720,H=260,L=48,R=8,T=24,B=30,cw=(W-L-R)/12,bw=Math.min(34,cw*0.62),s='';
  for(var g=0;g<=top;g+=step){var y=T+(H-T-B)*(1-g/top);s+='<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+EUR0.format(g)+'</text>'}
  cols.forEach(function(c,i){var h=(H-T-B)*(c.v/top),x=L+cw*i+(cw-bw)/2,y=H-B-h;
    s+='<g><title>'+moisLong(c.k)+' : '+eur(c.v)+'</title><rect class="bar'+(i===11?' last':'')+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,1)+'" rx="6"/>'+
      (i===11?'<text class="val" x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle">'+EUR0.format(c.v)+'</text>':'')+
      '<text x="'+(x+bw/2)+'" y="'+(H-10)+'" text-anchor="middle">'+moisCourt(c.k)+'</text></g>'});
  return '<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 '+W+' '+H+'" style="min-width:520px" role="img" aria-label="Commissions des 12 derniers mois">'+s+'</svg></div>';
}
function niceStep(max){var raw=max/4,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}

function chartDual(rows){
  var W=760,H=270,L=58,R=10,T=20,B=30,n=Math.max(rows.length,1);
  var hi=Math.max.apply(null,[1].concat(rows.map(function(r){return Math.max(r.ca,r.dep,r.marge)}))),lo=Math.min.apply(null,[0].concat(rows.map(function(r){return r.marge})));
  var step=niceStep(hi-lo),top=Math.ceil(hi/step)*step,bot=Math.floor(lo/step)*step;
  var Y=function(v){return T+(H-T-B)*(top-v)/(top-bot)},cw=(W-L-R)/Math.max(n,6),bw=Math.min(18,cw*.3),s='';
  for(var g=bot;g<=top+1e-9;g+=step)s+='<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g)+'" y2="'+Y(g)+'"/><text x="'+(L-8)+'" y="'+(Y(g)+4)+'" text-anchor="end">'+EUR0.format(g)+'</text>';
  var pts=[];
  rows.forEach(function(r,i){var cx=L+cw*i+cw/2;
    s+='<g><title>'+moisLong(r.k)+'\nCA HT : '+eur(r.ca)+'\nDépenses HT : '+eur(r.dep)+'\nRésultat : '+eur(r.marge)+'</title>'+
    '<rect x="'+(cx-bw-1)+'" y="'+Y(r.ca)+'" width="'+bw+'" height="'+Math.max(Y(0)-Y(r.ca),1)+'" rx="4" style="fill:var(--blue)"/>'+
    '<rect x="'+(cx+1)+'" y="'+Y(r.dep)+'" width="'+bw+'" height="'+Math.max(Y(0)-Y(r.dep),1)+'" rx="4" style="fill:var(--sky)"/>'+
    '<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+moisCourt(r.k)+'</text></g>';pts.push(cx+','+Y(r.marge))});
  if(pts.length>1)s+='<polyline points="'+pts.join(' ')+'" fill="none" style="stroke:var(--ok)" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(function(p){var a=p.split(',');s+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="3.5" style="fill:var(--ok)"/>'});
  return '<div style="overflow-x:auto" class="chart-scroll"><svg class="chart" viewBox="0 0 '+W+' '+H+'" style="min-width:560px" role="img" aria-label="Chiffre d’affaires, dépenses et résultat par mois">'+s+'</svg></div>';
}

/* ---------- Admin : dépenses et rentabilité ---------- */
function auteur(id){var p=(D().profiles||[]).find(function(x){return x.id===id});return p?(p.nom||'Administrateur'):'—'}
var CAT={marchandises:'Achats de marchandises',transport:'Transport et carburant',machines:'Achat de machines',reparations:'Réparations et pièces',logiciels:'Logiciels et abonnements',comptabilite:'Comptabilité et banque',assurances:'Assurances',internes:'Charges internes',autres:'Autres'};
var REC={aucune:'Ponctuelle',mensuelle:'Tous les mois',trimestrielle:'Tous les trimestres',annuelle:'Tous les ans'};
var TVAS=[20,10,5.5,2.1,0];
function pct(v){return String(v).replace('.',',')+' %'}
function params(){var p={ca_saisi:'ttc',tva_ventes:5.5};(D().parametres||[]).forEach(function(x){p[x.cle]=x.valeur});return p}
function caHT(ca){var p=params();return p.ca_saisi==='ttc'?(+ca)/(1+(+p.tva_ventes||0)/100):+ca}
function mKey(d){return ymd(monthStart(d))}
/* Échéances d'une dépense entre deux dates (incluses) */
function occurrences(dep,from,to){
  var start=parseD(dep.date),step={aucune:0,mensuelle:1,trimestrielle:3,annuelle:12}[dep.recurrence||'aucune'],out=[];
  if(!step){if(start>=from&&start<=to)out.push(start);return out}
  var end=dep.recurrence_fin?parseD(dep.recurrence_fin):to;if(end>to)end=to;
  for(var i=0;i<600;i++){var d=new Date(start.getFullYear(),start.getMonth()+i*step,Math.min(start.getDate(),28));if(d>end)break;if(d>=from)out.push(d)}
  return out;
}
function monthBounds(k){var a=parseD(k);return[a,new Date(a.getFullYear(),a.getMonth()+1,0)]}
/* Dépenses réellement payées sur un mois (vue trésorerie) */
function cashOfMonth(k){var b=monthBounds(k),rows=[];(D().depenses||[]).forEach(function(d){occurrences(d,b[0],b[1]).forEach(function(o){rows.push({dep:d,date:ymd(o)})})});return rows.sort(function(a,b){return a.date<b.date?1:-1})}
/* Coût « économique » d'une dépense sur un mois (machines amorties) */
function ecoOf(d,k){
  if(d.amortissement_mois){var s=monthStart(parseD(d.date)),n=+d.amortissement_mois,m=parseD(k),i=(m.getFullYear()-s.getFullYear())*12+m.getMonth()-s.getMonth();return i>=0&&i<n?(+d.montant_ht)/n:0}
  var b=monthBounds(k);return occurrences(d,b[0],b[1]).length*(+d.montant_ht);
}
function ecoMonth(k,filter){return (D().depenses||[]).filter(filter||function(){return true}).reduce(function(a,d){return a+ecoOf(d,k)},0)}
function revenueMonth(k,machineId){return D().releves.filter(function(r){return String(r.mois).slice(0,10)===k&&(!machineId||r.machine_id===machineId)}).reduce(function(a,r){a.ca+=caHT(r.ca);a.com+=+r.commission;return a},{ca:0,com:0})}
function margeMonth(k){var r=revenueMonth(k);return r.ca-r.com-ecoMonth(k)}

function chartMarge(cols){
  var W=720,H=250,L=56,R=8,T=22,B=30,vals=cols.map(function(c){return c.v});
  var hi=Math.max(0,Math.max.apply(null,vals)),lo=Math.min(0,Math.min.apply(null,vals)),step=niceStep(Math.max(hi-lo,1)),top=Math.ceil(hi/step)*step,bot=Math.floor(lo/step)*step;if(top===bot)top=step;
  var Y=function(v){return T+(H-T-B)*(top-v)/(top-bot)},cw=(W-L-R)/cols.length,bw=Math.min(34,cw*.62),s='';
  for(var g=bot;g<=top+1e-9;g+=step){s+='<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g)+'" y2="'+Y(g)+'"'+(Math.abs(g)<1e-9?' style="stroke:var(--muted)"':'')+'/><text x="'+(L-8)+'" y="'+(Y(g)+4)+'" text-anchor="end">'+EUR0.format(g)+'</text>'}
  cols.forEach(function(c,i){var x=L+cw*i+(cw-bw)/2,y0=Y(0),y1=Y(c.v),last=i===cols.length-1;
    s+='<g><title>'+moisLong(c.k)+' : '+eur(c.v)+'</title><rect x="'+x+'" y="'+Math.min(y0,y1)+'" width="'+bw+'" height="'+Math.max(Math.abs(y1-y0),1)+'" rx="5" style="fill:'+(c.v<0?'var(--bad)':last?'var(--blue)':'var(--sky)')+'"/>'+
    (last?'<text class="val" x="'+(x+bw/2)+'" y="'+(c.v<0?y1+14:y1-7)+'" text-anchor="middle">'+EUR0.format(c.v)+'</text>':'')+'<text x="'+(x+bw/2)+'" y="'+(H-10)+'" text-anchor="middle">'+moisCourt(c.k)+'</text></g>'});
  return '<div style="overflow-x:auto" class="chart-scroll"><svg class="chart" viewBox="0 0 '+W+' '+H+'" style="min-width:520px" role="img" aria-label="Marge nette des 12 derniers mois">'+s+'</svg></div>';
}

function vDepenses(v){
  var mk=S.depMonth||ymd(addMonths(monthStart(new Date()),-1)).slice(0,7),k=mk+'-01',year=parseD(k).getFullYear();
  var cash=cashOfMonth(k),ht=cash.reduce(function(a,r){return a+(+r.dep.montant_ht)},0),tva=cash.reduce(function(a,r){return a+(+r.dep.tva||Math.round(r.dep.montant_ht*r.dep.taux_tva)/100)},0);
  var rev=revenueMonth(k),eco=ecoMonth(k),marge=rev.ca-rev.com-eco;
  var ytd=0;for(var m=0;m<=parseD(k).getMonth();m++)ytd+=margeMonth(ymd(new Date(year,m,1)));
  var cols=[];for(var i=11;i>=0;i--){var kk=ymd(addMonths(parseD(k),-i));cols.push({k:kk,v:margeMonth(kk)})}
  var byCat={};cash.forEach(function(r){byCat[r.dep.categorie]=(byCat[r.dep.categorie]||0)+(+r.dep.montant_ht)});
  var cats=Object.keys(byCat).map(function(c){return[c,byCat[c]]}).sort(function(a,b){return b[1]-a[1]}),cmax=cats.length?cats[0][1]:1;
  var p=params();
  var mrows=D().machines.filter(function(m){return m.statut!=='retiree'}).map(function(m){

    return{m:m,ca:r.ca,com:r.com,ch:ch,marge:r.ca-r.com-ch,buy:buy,pay:buy?Math.max(0,cum/buy*100):null};
  }).sort(function(a,b){return b.marge-a.marge});
  v.innerHTML='<div class="page-h"><div><span class="eyebrow">Dépenses</span><h1>Dépenses et rentabilité</h1><p class="muted">Visible uniquement par les administrateurs GOMATIK.</p></div>'+

  '<div class="card kpi"><span class="k-l">Résultat cumulé '+year+'</span><span class="k-v" style="color:'+(ytd<0?'var(--bad)':'inherit')+'">'+eur(ytd)+'</span><span class="k-s">De janvier à '+moisLong(k).toLowerCase()+'</span></div></div>'+
  '<div class="grid g-2" style="margin-top:16px"><div class="card"><div class="card-h"><h2>Marge nette sur 12 mois</h2><span class="muted">Machines amorties</span></div>'+chartMarge(cols)+'</div>'+
  '<div class="card"><div class="card-h"><h2>Dépenses par catégorie</h2><span class="muted">'+moisLong(k)+', HT</span></div>'+(cats.length?'<div class="bars">'+cats.map(function(c){return '<div class="b"><span>'+esc(CAT[c[0]])+'</span><span class="num muted">'+eur(c[1])+'</span><i style="--w:'+Math.round(c[1]/cmax*100)+'%"></i></div>'}).join('')+'</div>':'<p class="muted">Aucune dépense ce mois-ci.</p>')+'</div></div>'+

  '<div class="tbl-wrap"><table><thead><tr><th>Machine</th><th class="r">CA HT</th><th class="r">Commission</th><th class="r">Charges affectées</th><th class="r">Marge directe</th><th>Machine remboursée</th></tr></thead><tbody>'+
  mrows.map(function(x){var c=clientById(clientOfMachine(x.m));return '<tr><td style="min-width:190px"><b>'+esc(x.m.numero||'')+'</b> '+esc(x.m.modele)+'<div class="muted" style="font-size:.8rem">'+esc(c?c.nom:'')+'</div></td><td class="r num">'+eur(x.ca)+'</td><td class="r num">'+eur(x.com)+'</td><td class="r num">'+eur(x.ch)+'</td><td class="r num"><b style="color:'+(x.marge<0?'var(--bad)':'var(--ok)')+'">'+eur(x.marge)+'</b></td>'+
    '<td style="min-width:150px">'+(x.pay==null?'<span class="muted" style="font-size:.85rem">Prix d’achat non saisi</span>':'<div class="bars"><div class="b"><span class="num">'+Math.min(100,Math.round(x.pay))+' %</span><span class="muted num" style="font-size:.8rem">'+EUR0.format(x.buy)+'</span><i style="--w:'+Math.min(100,x.pay)+'%"></i></div></div>')+'</td></tr>'}).join('')+
  '</tbody></table></div><p class="muted" style="font-size:.85rem;margin-top:8px">Marge directe = CA HT − commission du client − dépenses affectées à la machine (achat amorti, marchandises, réparations). Les frais généraux non affectés sont comptés dans la marge nette globale.</p>'+
  '<h2 style="margin:28px 0 12px">Dépenses de '+moisLong(k).toLowerCase()+'</h2>'+
  (cash.length?'<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Dépense</th><th>Catégorie</th><th>Affectée à</th><th>Saisie par</th><th class="r">HT</th><th class="r">TVA</th><th class="r">TTC</th><th class="r"></th></tr></thead><tbody>'+
  cash.map(function(r){var d=r.dep,m=d.machine_id?machineById(d.machine_id):null,c=d.client_id?clientById(d.client_id):null,tv=+d.tva||Math.round(d.montant_ht*d.taux_tva)/100;
    return '<tr><td class="num">'+dateCourt(r.date)+'</td><td style="min-width:200px"><b>'+esc(d.libelle)+'</b><div class="muted" style="font-size:.8rem">'+esc(d.fournisseur||'')+(d.recurrence&&d.recurrence!=='aucune'?' · '+REC[d.recurrence]:'')+(d.amortissement_mois?' · amortie sur '+d.amortissement_mois+' mois':'')+'</div></td>'+
    '<td>'+esc(CAT[d.categorie])+'</td><td>'+(m?esc(m.numero||m.modele):c?esc(c.nom):'<span class="muted">Général</span>')+'</td><td style="white-space:nowrap">'+esc(auteur(d.created_by))+'</td><td class="r num">'+eur(d.montant_ht)+'</td><td class="r num muted">'+eur(tv)+'</td><td class="r num">'+eur(+d.montant_ht+tv)+'</td>'+
    '<td class="r"><div class="row-actions">'+(d.justificatif?'<button class="btn btn-ghost btn-sm" data-just="'+esc(d.justificatif)+'">Facture</button>':'')+'<button class="btn btn-ghost btn-sm" data-edit="'+d.id+'">Modifier</button><button class="btn btn-ghost btn-sm" data-del="'+d.id+'">Supprimer</button></div></td></tr>'}).join('')+
  '</tbody></table></div>':'<div class="empty">Aucune dépense sur ce mois.</div>')+
  '<details class="client" style="margin-top:24px"><summary><div><b>Paramètres de calcul</b><div class="muted" style="font-size:.86rem">CA relevé '+(p.ca_saisi==='ttc'?'TTC':'HT')+' · TVA moyenne sur les ventes '+pct(p.tva_ventes)+'</div></div></summary><div class="inner"><form class="form-grid" id="f-param">'+
  '<div class="field"><span class="lbl">Le CA relevé sur les machines est</span><div class="chips"><input type="radio" name="cas" id="cas1" value="ttc"'+(p.ca_saisi==='ttc'?' checked':'')+'><label for="cas1">TTC</label><input type="radio" name="cas" id="cas2" value="ht"'+(p.ca_saisi!=='ttc'?' checked':'')+'><label for="cas2">HT</label></div></div>'+
  '<div class="field"><label for="tvav">TVA moyenne sur les ventes (%)</label><input id="tvav" type="number" min="0" max="20" step="0.1" value="'+p.tva_ventes+'"></div>'+
  '<p class="muted full" style="font-size:.85rem">Sert à convertir le CA relevé en HT pour calculer la marge. Le taux dépend des produits vendus : faites-le valider par votre comptable LegalPlace.</p>'+
  '<button class="btn btn-primary btn-sm" style="justify-self:start">Enregistrer les paramètres</button></form></div></details>';
  $$('.chart-scroll',v).forEach(function(c){c.scrollLeft=c.scrollWidth});
  $('#d-month').addEventListener('change',function(e){S.depMonth=e.target.value;render()});
  $('#d-new').addEventListener('click',function(){depForm(null)});
  $('#d-export').addEventListener('click',function(){exportForm(k)});
  $$('[data-edit]',v).forEach(function(b){b.addEventListener('click',function(){depForm(D().depenses.find(function(d){return d.id===b.dataset.edit}))})});
  $$('[data-del]',v).forEach(function(b){b.addEventListener('click',function(){
    if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent='Confirmer ?';b.style.borderColor='var(--bad)';b.style.color='var(--bad)';setTimeout(function(){if(b.isConnected){b.dataset.armed='';b.textContent='Supprimer';b.style.cssText=''}},4000);return}
    API.remove('depenses',b.dataset.del).then(reload).then(function(){render();toast('Dépense supprimée.')}).catch(function(x){toast('Erreur : '+x.message)})})});
  $$('[data-just]',v).forEach(function(b){b.addEventListener('click',function(){if(!LIVE){toast('Justificatif d’exemple : l’ouverture fonctionne sur le site en ligne.');return}
    API.justifUrl(b.dataset.just).then(function(u){window.open(u,'_blank','noopener')}).catch(function(){toast('Justificatif indisponible.')})})});

function depForm(d){
  var isNew=!d;d=d||{date:ymd(new Date()),categorie:'marchandises',taux_tva:20,recurrence:'aucune'};
  var ms=D().machines.filter(function(m){return m.statut!=='retiree'||m.id===d.machine_id});
  var root=$('#modal-root');
  root.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="Dépense"><form class="card stack" id="f-dep" novalidate><div class="card-h"><h2>'+(isNew?'Nouvelle dépense':'Modifier la dépense')+'</h2><button type="button" class="btn btn-ghost btn-sm" id="m-close">Fermer</button></div>'+
  '<div class="form-grid"><div class="field"><label for="dp-date">Date</label><input type="date" id="dp-date" value="'+esc(String(d.date).slice(0,10))+'" required></div>'+
  '<div class="field"><label for="dp-cat">Catégorie</label><select id="dp-cat">'+Object.keys(CAT).map(function(c){return '<option value="'+c+'"'+(d.categorie===c?' selected':'')+'>'+CAT[c]+'</option>'}).join('')+'</select></div>'+
  '<div class="field"><label for="dp-lib">Libellé</label><input id="dp-lib" value="'+esc(d.libelle||'')+'" placeholder="Ex. Réassort boissons" required></div>'+
  '<div class="field"><label for="dp-four">Fournisseur</label><input id="dp-four" value="'+esc(d.fournisseur||'')+'"></div>'+
  '<div class="field"><label for="dp-ht">Montant HT (€)</label><input id="dp-ht" type="number" min="0" step="0.01" inputmode="decimal" value="'+(d.montant_ht!=null?d.montant_ht:'')+'" required></div>'+
  '<div class="field"><label for="dp-tva">Taux de TVA</label><select id="dp-tva">'+TVAS.map(function(t){return '<option value="'+t+'"'+(+d.taux_tva===t?' selected':'')+'>'+pct(t)+'</option>'}).join('')+'</select></div>'+
  '<p class="full muted" id="dp-ttc" style="font-size:.9rem"></p>'+
  '<div class="field"><label for="dp-m">Affecter à une machine</label><select id="dp-m"><option value="">Aucune (frais généraux)</option>'+ms.map(function(m){var c=clientById(clientOfMachine(m));return '<option value="'+m.id+'"'+(d.machine_id===m.id?' selected':'')+'>'+esc(m.numero||'')+' · '+esc(c?c.nom:'')+'</option>'}).join('')+'</select></div>'+
  '<div class="field"><label for="dp-c">ou à un client</label><select id="dp-c"><option value="">Aucun</option>'+D().clients.map(function(c){return '<option value="'+c.id+'"'+(d.client_id===c.id?' selected':'')+'>'+esc(c.nom)+'</option>'}).join('')+'</select></div>'+
  '<div class="field"><label for="dp-rec">Récurrence</label><select id="dp-rec">'+Object.keys(REC).map(function(r){return '<option value="'+r+'"'+(d.recurrence===r?' selected':'')+'>'+REC[r]+'</option>'}).join('')+'</select></div>'+
  '<div class="field" id="dp-fin-w"><label for="dp-fin">Dernière échéance (facultatif)</label><input type="date" id="dp-fin" value="'+esc(d.recurrence_fin||'')+'"></div>'+
  '<div class="field" id="dp-am-w"><label for="dp-am">Amortir sur (mois)</label><input id="dp-am" type="number" min="1" max="240" step="1" value="'+(d.amortissement_mois||60)+'"><span class="muted" style="font-size:.82rem">60 mois = 5 ans. Le coût est étalé dans la rentabilité.</span></div>'+
  '<div class="field full"><label for="dp-file">Justificatif (photo ou PDF de la facture)</label><input type="file" id="dp-file" accept="application/pdf,image/*">'+(d.justificatif?'<span class="muted" style="font-size:.82rem">Un justificatif est déjà enregistré. En choisir un autre le remplace.</span>':'')+'</div></div>'+
  '<p class="muted" style="font-size:.88rem">'+(isNew?'Saisie par <b>'+esc(S.userName)+'</b>':'Saisie par <b>'+esc(auteur(d.created_by))+'</b>')+'</p><p class="err" id="dp-err"></p><button class="btn btn-primary" type="submit" style="align-self:flex-start">'+(isNew?'Ajouter la dépense':'Enregistrer')+'</button></form></div>';
  var sync=function(){var ht=parseFloat($('#dp-ht').value),t=parseFloat($('#dp-tva').value);$('#dp-ttc').textContent=isNaN(ht)?'':'TVA '+eur(Math.round(ht*t)/100)+' · Total TTC '+eur(ht+Math.round(ht*t)/100);
    var isM=$('#dp-cat').value==='machines';$('#dp-am-w').hidden=!isM;$('#dp-rec').disabled=isM;if(isM)$('#dp-rec').value='aucune';$('#dp-fin-w').hidden=$('#dp-rec').value==='aucune'};
  $('#f-dep').addEventListener('input',sync);$('#f-dep').addEventListener('change',sync);sync();
  var close=function(){root.innerHTML=''};$('#m-close').addEventListener('click',close);
  $('#f-dep').addEventListener('submit',function(e){e.preventDefault();var er=$('#dp-err'),ht=parseFloat($('#dp-ht').value),lib=$('#dp-lib').value.trim();

    var row={date:$('#dp-date').value,categorie:$('#dp-cat').value,libelle:lib,fournisseur:$('#dp-four').value.trim()||null,montant_ht:ht,taux_tva:parseFloat($('#dp-tva').value),
      machine_id:$('#dp-m').value||null,client_id:$('#dp-c').value||null,recurrence:isM?'aucune':rec,recurrence_fin:(!isM&&rec!=='aucune'&&$('#dp-fin').value)||null,amortissement_mois:isM?(parseInt($('#dp-am').value,10)||60):null};
    if(!LIVE){row.tva=Math.round(ht*row.taux_tva)/100;row.montant_ttc=ht+row.tva;if(isNew)row.created_by=S.userId}
    var b=e.target.querySelector('button[type=submit]');b.disabled=true;
    var f=$('#dp-file').files[0];
    (f?API.uploadJustif(f).then(function(path){row.justificatif=path}):Promise.resolve())
    .then(function(){return isNew?API.insert('depenses',row):API.update('depenses',d.id,row)})
    .then(reload).then(function(){close();S.depMonth=row.date.slice(0,7);render();toast(isNew?'Dépense ajoutée.':'Dépense mise à jour.')})
    .catch(function(x){er.textContent=x.message;b.disabled=false});
  });
}

function exportForm(k){
  var root=$('#modal-root'),y=parseD(k).getFullYear();
  root.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="Export"><form class="card stack" id="f-exp"><div class="card-h"><h2>Exporter pour le comptable</h2><button type="button" class="btn btn-ghost btn-sm" id="m-close">Fermer</button></div>'+
  '<p class="muted">Fichier CSV (séparateur point-virgule, compatible Excel) avec toutes les dépenses de la période, échéances récurrentes comprises.</p>'+
  '<div class="chips"><input type="radio" name="per" id="per1" value="m" checked><label for="per1">'+moisLong(k)+'</label><input type="radio" name="per" id="per2" value="y"><label for="per2">Année '+y+'</label></div>'+
  '<p class="muted" style="font-size:.88rem">Pensez à déposer aussi les factures (justificatifs) dans votre espace LegalPlace, comme le demande votre comptable.</p>'+
  '<button class="btn btn-primary" style="align-self:flex-start">Télécharger le fichier</button></form></div>';
  $('#m-close').addEventListener('click',function(){root.innerHTML=''});
  $('#f-exp').addEventListener('submit',function(e){e.preventDefault();
    var yearly=$('input[name=per]:checked').value==='y',from=yearly?new Date(y,0,1):monthBounds(k)[0],to=yearly?new Date(y,11,31):monthBounds(k)[1],rows=[];
    (D().depenses||[]).forEach(function(d){occurrences(d,from,to).forEach(function(o){rows.push({d:d,date:ymd(o)})})});
    rows.sort(function(a,b){return a.date<b.date?-1:1});
    var n=function(v){return (Math.round(v*100)/100).toFixed(2).replace('.',',')},q=function(s){s=String(s==null?'':s);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
    var lines=[['Date','Fournisseur','Libellé','Catégorie','Montant HT','Taux TVA','TVA','Montant TTC','Machine','Client','Justificatif','Saisi par'].join(';')];
    rows.forEach(function(r){var d=r.d,tv=Math.round(d.montant_ht*d.taux_tva)/100,m=d.machine_id?machineById(d.machine_id):null,c=d.client_id?clientById(d.client_id):null;
      lines.push([dateCourt(r.date),q(d.fournisseur),q(d.libelle),q(CAT[d.categorie]),n(d.montant_ht),n(d.taux_tva),n(tv),n(+d.montant_ht+tv),q(m?m.numero||m.modele:''),q(c?c.nom:''),q(d.justificatif?d.justificatif.split('/').pop():''),q(auteur(d.created_by))].join(';'))});
    if(!LIVE){root.innerHTML='';toast(rows.length+' ligne(s) prêtes. Le téléchargement fonctionne sur le site en ligne.');return}
    var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='GOMATIK-depenses-'+(yearly?y:k.slice(0,7))+'.csv';document.body.appendChild(a);a.click();a.remove();
    root.innerHTML='';toast('Export téléchargé : '+rows.length+' ligne(s).');
  });
}

boot();
})();
</script>
